# Czech translation of Merlin Bird ID's interface.
#
# Read by app.kecerim24.patches.merlin.czechTranslationPatch. Each key is an Android string
# resource name and each value is the Czech text; the comment above an entry is the app's own
# English text, for review. An entry with a blank value is left untranslated.
#
# Preserve every format argument (%s, %1$d, ...) exactly as the English text has it: the patch
# skips any entry whose arguments do not match, and a mismatch that slipped through would crash
# the app when the string is formatted. Keep the #hash# markers, the HTML tags and the product
# names (Merlin, eBird, Sound ID, Photo ID, AX Visio, dG, Swarovski Optik).
#
# Resource names the app uses for preference keys, deep links, URLs, date patterns and vector
# path data are deliberately absent; translating them would break the app.

