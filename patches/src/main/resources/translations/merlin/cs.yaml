# Merlin can identify %1$s of the likely birds in this area, so the results you see in Sound ID will be incomplete. For Merlin to learn the rest, it needs to be trained using more sound recordings of those birds. You may be hearing birds Merlin can't identify yet, so if you also use eBird, be sure to contribute your recording to your checklist! /  / Sound ID is currently available for %2$d species. Sound ID will be expanded in the future to include species worldwide, but to do that, our team needs a minimum of 150 sound recordings for each species to train Merlin to recognize their sounds. You can help us add new species to Merlin by recording the birds in your area and uploading them with your eBird checklists.
sound_id_coverage_help_question1_answer: "Merlin dokáže určit %1$s pravděpodobných ptáků v této oblasti, takže výsledky v Sound ID budou nekompletní. Aby se Merlin naučil zbytek, potřebuje k tomu více zvukových nahrávek těchto ptáků. Můžete slyšet ptáky, které Merlin ještě neumí určit, takže pokud používáte i eBird, přidejte prosím svou nahrávku do svého seznamu pozorování!\n\nSound ID je momentálně dostupné pro %2$d druhů. V budoucnu se rozšíří na druhy z celého světa, k tomu ale náš tým potřebuje u každého druhu alespoň 150 zvukových nahrávek, aby Merlin naučil jeho hlas rozpoznávat. Pomoci nám můžete tím, že budete nahrávat ptáky ve svém okolí a nahrávky odešlete se svými seznamy do eBirdu."

# Merlin Bird ID is a community-built resource, relying on the data and media collected by over a million birders around the world! If you use eBird and are in an area not covered by Sound ID, you can best contribute by recording the songs and calls of the birds around you and uploading them to your eBird checklists.
sound_id_coverage_help_question2_answer: "Merlin Bird ID vzniká díky komunitě a opírá se o data a média, která nasbíralo přes milion ornitologů z celého světa! Pokud používáte eBird a jste v oblasti, kterou Sound ID nepokrývá, nejvíc pomůžete tím, že budete nahrávat zpěv a hlasy ptáků ve svém okolí a nahrávky odešlete do svých seznamů v eBirdu."

