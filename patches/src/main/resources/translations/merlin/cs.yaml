# Why isn't Merlin identifying my bird?
why_isnt_merlin_identifying: "Proč Merlin mého ptáka neurčuje?"

# <html><body><p>Merlin results are best when you are in a quiet place, close to the bird, and standing still. There are a few reasons Merlin might not identify something:</p><ul><li>Merlin may not be able to hear the bird. Check to see if your phone’s microphone is clogged, and try to get closer to the bird without disturbing it.</li><br/><li>You may be hearing a bird or vocalization type that Merlin can’t identify yet. Sound ID will be expanded in the future to include more birds worldwide.</li><br/><li>The sound may be similar to another species, and Merlin isn’t confident enough with what it’s heard so far.</li><br/><li>The sound may not be a bird! Many mammals, frogs, and insects make chirping calls that can sound like birds.</li></body></html>
why_isnt_merlin_identifying_text: "<html><body><p>Merlin dává nejlepší výsledky, když jste na tichém místě, blízko ptáka a stojíte v klidu. Existuje několik důvodů, proč Merlin něco neurčí:</p><ul><li>Merlin možná ptáka neslyší. Zkontrolujte, jestli není mikrofon telefonu zanesený, a zkuste se k ptákovi přiblížit, aniž byste ho vyrušili.</li><br/><li>Možná slyšíte ptáka nebo typ hlasu, který Merlin ještě neumí určit. Sound ID se v budoucnu rozšíří na další ptáky z celého světa.</li><br/><li>Hlas může být podobný jinému druhu a Merlin si tím, co dosud slyšel, není dost jistý.</li><br/><li>Nemusí jít o ptáka! Mnoho savců, žab a hmyzu vydává cvrlikavé zvuky, které mohou znít jako ptáci.</li></body></html>"

