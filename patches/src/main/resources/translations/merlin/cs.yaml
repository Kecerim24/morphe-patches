# Assuming that you saw the bird at your current location, granting access to your current location is the best way for Merlin to find out which birds are near you. Location is also essential for Sound ID to give you accurate results. If Merlin does not know your location, results will be inaccurate and Merlin may suggest bird species that are not found in your area. /  / Before adding a sighting to your life list in Merlin or to an eBird checklist, be sure to enable location permissions. If your saved sound recording doesn't have a location, you can manually set a location for the file using the edit button at the top of the screen.
botd_location_services_help_text: "Pokud jste ptáka viděli na svém současném místě, je povolení přístupu k poloze nejlepší způsob, jak Merlin zjistí, kteří ptáci se u vás vyskytují. Poloha je také nezbytná, aby vám Sound ID dávalo přesné výsledky. Pokud Merlin vaši polohu nezná, budou výsledky nepřesné a Merlin může navrhovat druhy, které se ve vaší oblasti nevyskytují.\n\nNež přidáte pozorování do svého life listu v Merlinu nebo do seznamu v eBirdu, nezapomeňte povolit přístup k poloze. Pokud uložená nahrávka polohu neobsahuje, můžete ji souboru nastavit ručně tlačítkem pro úpravu v horní části obrazovky."

# Location is essential for bird ID. For Merlin to work properly, location services must be enabled.
